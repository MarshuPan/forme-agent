[package]
name = "forme-execution"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
forme-protocol = { path = "../protocol" }
forme-policy = { path = "../policy" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
headless_chrome = "=1.0.22"
portable-pty = "=0.9.0"
httparse = "=1.10.1"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "=1.15.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.150", features = ["raw_value"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
url = "=2.5.8"
ureq = "=3.3.0"
zeroize = "=1.9.0"

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "=0.6.1"
win-custody = "=0.1.1"
xcap = "=0.9.6"
windows-service = "=0.8.1"
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_SystemInformation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
signal-hook = "=0.4.5"

[[bin]]
name = "forme-pty-fixture"
path = "tests/fixtures/pty_fixture.rs"
test = false
bench = false

[[bin]]
name = "forme-executord"
path = "src/bin/forme-executord.rs"

[[bin]]
name = "forme-host-storage-fixture"
path = "tests/fixtures/host_storage_fixture.rs"
test = false
bench = false

[[bin]]
name = "forme-hostd"
path = "src/bin/forme-hostd.rs"

[[bin]]
name = "forme-worker-fixture"
path = "tests/fixtures/worker_fixture.rs"
test = false
bench = false

[dev-dependencies]
rcgen = "=0.14.8"
