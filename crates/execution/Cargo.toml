[package]
name = "forme-execution"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[dependencies]
forme-protocol = { path = "../protocol" }
forme-policy = { path = "../policy" }
headless_chrome = "=1.0.22"
portable-pty = "=0.9.0"
httparse = "=1.10.1"
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "=1.15.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sha2 = "=0.10.9"
url = "=2.5.8"
ureq = "=3.3.0"

[target.'cfg(target_os = "windows")'.dependencies]
enigo = "=0.6.1"
xcap = "=0.9.6"

[[bin]]
name = "forme-pty-fixture"
path = "tests/fixtures/pty_fixture.rs"
test = false
bench = false

[[bin]]
name = "forme-executord"
path = "src/bin/forme-executord.rs"

[dev-dependencies]
rcgen = "=0.14.8"
