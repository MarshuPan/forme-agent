[package]
name = "forme-gateway"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[dependencies]
forme-protocol = { path = "../protocol" }
forme-harness = { path = "../harness" }
forme-communication = { path = "../communication" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
getrandom = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "=0.7.0", features = ["timeout"] }

[[bin]]
name = "forme-gatewayd"
path = "src/main.rs"
