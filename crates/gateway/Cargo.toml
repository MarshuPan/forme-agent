[package]
name = "forme-gateway"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
forme-protocol = { path = "../protocol" }
forme-harness = { path = "../harness" }
forme-communication = { path = "../communication" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
getrandom = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "=0.7.0", features = ["timeout"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc", "zeroize"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
rusqlite = { version = "=0.40.1", default-features = false, features = ["bundled"] }
zeroize = "=1.9.0"

[[bin]]
name = "forme-gatewayd"
path = "src/main.rs"
