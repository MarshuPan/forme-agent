[package]
name = "forme-store"
version = "0.0.1"
edition.workspace = true
publish.workspace = true

[dependencies]
forme-protocol = { path = "../protocol" }
chacha20poly1305 = { version = "=0.11.0", default-features = true }
getrandom = "=0.4.3"
rusqlite = { version = "=0.40.1", default-features = false, features = ["backup", "bundled"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[[bin]]
name = "forme-replicad"
path = "src/bin/forme-replicad.rs"
