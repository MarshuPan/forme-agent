[package]
name = "forme-cli"
version = "0.0.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
default-run = "forme-cli"

[dependencies]
forme-protocol = { path = "../protocol" }
forme-gateway = { path = "../gateway" }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
getrandom = "=0.4.3"
serde_json = "=1.0.150"
serde = { version = "=1.0.228", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
is_elevated = "=0.1.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", default-features = false, features = ["std", "process"] }

[[bin]]
name = "forme-hostctl"
path = "src/bin/forme-hostctl.rs"
